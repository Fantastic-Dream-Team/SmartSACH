services:
  - type: web
    name: smartsach
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /backend/index.php/api/health
    autoDeploy: true
    plan: free
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: APP_DEBUG
        value: "false"
      - key: APP_BUILD
        value: "build-react-render"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSLMODE
        value: require
